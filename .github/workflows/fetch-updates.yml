name: Fetch Regulatory Updates

on:
  schedule:
    - cron: "0 3 * * 1"  # Har Somwar 3am UTC = 8:30am IST
  workflow_dispatch:       # Manual trigger bhi

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser supabase tzdata

      - name: Run fetcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: "false"
        run: python scripts/fetch_regulatory_updates.py